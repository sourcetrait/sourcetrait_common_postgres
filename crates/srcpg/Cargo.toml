[package]
name = "srcpg"
version = "0.0.1"
description = "Common PostgreSQL extension for Rust"
authors = ["SourceTrait <development@sourcetrait.com>"]
license = "AGPL-3.0-or-later WITH GPL-3.0-linking-source-exception"
repository = "https://github.com/sourcetrait/sourcetrait_common"
homepage = "https://sourcetrait.com"
categories = []
keywords = ["sourcetrait", "postgres", "srcpg"]
edition = "2024"

[lib]
crate-type = ["cdylib", "lib"]

[[bin]]
name = "pgrx_embed_srcpg"
path = "./src/bin/pgrx_embed.rs"

[dependencies]
pgrx.workspace = true
serde.workspace = true

[dev-dependencies]
pgrx-tests.workspace = true

[features]
default = ["pg18"]
pg18 = ["pgrx/pg18", "pgrx-tests/pg18" ]
pg_test = []

[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"
opt-level = 3
lto = "fat"
codegen-units = 1
